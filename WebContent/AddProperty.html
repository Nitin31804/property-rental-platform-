<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Host Portal | Dacha Stays</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <a href="index.html">Dacha <span>Stays</span></a>
        </div>
        <div class="nav-links">
            <!-- Injected by auth.js -->
        </div>
    </nav>

    <main class="container">
        <div style="max-width: 600px; margin: 0 auto;">
            <h1 style="margin-bottom: 0.5rem;">List your property</h1>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">Join thousands of hosts earning extra income by renting out their space.</p>
            
            <section class="widget">
                <form id="addPropertyForm">
                    <div class="form-group">
                        <label>Property Title</label>
                        <input type="text" id="title" class="form-input" placeholder="e.g. Stunning Skyline Penthouse" required>
                    </div>

                    <div class="form-group">
                        <label>City / Location</label>
                        <input type="text" id="location" class="form-input" placeholder="e.g. New York City, NY" required>
                    </div>

                    <div class="form-group">
                        <label>Price per night ($)</label>
                        <input type="number" id="price" class="form-input" placeholder="150" min="1" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label>Cover Image URL</label>
                        <input type="url" id="coverUrl" class="form-input" placeholder="https://images.unsplash.com/..." required>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description" class="form-input" placeholder="Describe the best features of your space..." required></textarea>
                    </div>

                    <div id="statusPanel" class="status-panel">
                        <div id="statusText"></div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-primary">Publish Listing</button>
                </form>
            </section>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('addPropertyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusPanel = document.getElementById('statusPanel');
            const statusText = document.getElementById('statusText');

            submitBtn.disabled = true;
            submitBtn.textContent = "Publishing...";
            statusPanel.className = 'status-panel visible loading';
            statusText.textContent = "Uploading to database...";

            const payload = {
                title: document.getElementById('title').value,
                location: document.getElementById('location').value,
                price: document.getElementById('price').value,
                coverUrl: document.getElementById('coverUrl').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch('/property-rental-app/api/add-property', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusPanel.className = 'status-panel visible success';
                    statusText.textContent = "Property published successfully!";
                    document.getElementById('addPropertyForm').reset();
                } else {
                    throw new Error(data.error || "Failed to publish");
                }
            } catch (error) {
                statusPanel.className = 'status-panel visible error';
                statusText.textContent = error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Publish Listing";
            }
        });
    </script>
</body>
</html>
