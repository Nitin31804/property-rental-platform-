<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dacha Stays</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <a href="index.html">Dacha <span>Stays</span></a>
        </div>
        <div class="nav-links">
            <!-- Injected by auth.js -->
        </div>
    </nav>

    <header class="hero">
        <h1>Find Your Next Stay</h1>
        <p>Compare prices and discover incredible homes across the globe.</p>
        
        <!-- Aggregator Search Widget -->
        <div class="search-widget">
            <div class="search-input-group">
                <label>Location</label>
                <input type="text" id="searchInput" placeholder="Where to? (e.g. Paris)">
            </div>
            <div class="search-input-group">
                <label>Check In</label>
                <input type="date">
            </div>
            <div class="search-input-group">
                <label>Check Out</label>
                <input type="date">
            </div>
            <div class="search-input-group">
                <label>Guests</label>
                <input type="number" placeholder="2 Adults">
            </div>
            <button id="searchDealsBtn" class="search-btn">Search Deals</button>
        </div>
    </header>

    <main class="container">
        <h2 style="margin-bottom: 1rem; font-size: 2rem;" id="resultsTitle">Trending Destinations</h2>
        <p style="color: var(--text-secondary); font-size: 1.2rem; margin-bottom: 2rem;">Discover luxury penthouses, cozy cabins, and beachfront villas.</p>

        <div class="split-layout">
            <!-- Sidebar Filters -->
            <aside class="sidebar-filters" style="width: 250px; background: white; padding: 1.5rem; border-radius: 1rem; border: 1px solid var(--glass-border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); height: fit-content; position: sticky; top: 100px;">
                <h3 style="margin-bottom: 1rem;">Filter by:</h3>
                
                <div class="filter-group" style="margin-bottom: 1.5rem;">
                    <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Property Type</label>
                    <select id="typeFilter" style="width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #cbd5e1;">
                        <option value="">All Types</option>
                        <option value="Hotel">Hotel</option>
                        <option value="Villa">Villa</option>
                        <option value="Apartment">Apartment</option>
                        <option value="Cabin">Cabin</option>
                        <option value="Resort">Resort</option>
                    </select>
                </div>
                
                <div class="filter-group" style="margin-bottom: 1.5rem;">
                    <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Max Price: $<span id="priceVal">2500</span></label>
                    <input type="range" id="priceFilter" min="50" max="2500" value="2500" style="width: 100%;">
                </div>

                <div class="filter-group">
                    <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Amenities</label>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.9rem;">
                        <label><input type="checkbox" class="amenity-cb" value="Pool"> Pool</label>
                        <label><input type="checkbox" class="amenity-cb" value="WiFi"> Free WiFi</label>
                        <label><input type="checkbox" class="amenity-cb" value="Pet Friendly"> Pet Friendly</label>
                        <label><input type="checkbox" class="amenity-cb" value="Breakfast Included"> Breakfast Included</label>
                        <label><input type="checkbox" class="amenity-cb" value="Ocean View"> Ocean View</label>
                    </div>
                </div>
            </aside>

            <!-- Property Grid Area -->
            <div class="content-area" style="flex: 2;">
                <div class="property-grid" id="propertyGrid">
                    <!-- Skeletons and Properties injected via JS -->
                </div>
            </div>
            
            <!-- Map Area -->
            <div class="map-area" id="map"></div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Simple Footer -->
    <footer style="text-align: center; padding: 3rem; background: var(--card-bg); border-top: 1px solid var(--glass-border); margin-top: 4rem;">
        <p style="color: var(--text-secondary); margin-bottom: 1rem;">© 2026 Dacha Stays. All rights reserved.</p>
        <a href="Contact.html" style="color: var(--accent-color); font-weight: 600;">Contact Support / Feedback</a>
    </footer>

    <script src="js/auth.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Global variables
        let map;
        let markers = [];
        
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = message;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function renderSkeletons() {
            const grid = document.getElementById('propertyGrid');
            grid.innerHTML = '';
            for(let i=0; i<8; i++) {
                grid.innerHTML += `<div class="skeleton"></div>`;
            }
        }

        async function fetchAndRenderProperties(location = '') {
            renderSkeletons();
            const grid = document.getElementById('propertyGrid');
            
            // Gather filters
            const type = document.getElementById('typeFilter').value;
            const maxPrice = document.getElementById('priceFilter').value;
            const checkedAmenities = Array.from(document.querySelectorAll('.amenity-cb:checked')).map(cb => cb.value).join(',');
            
            try {
                let url = `/property-rental-app/api/properties?location=${encodeURIComponent(location)}&maxPrice=${maxPrice}`;
                if (type) url += `&propertyType=${encodeURIComponent(type)}`;
                if (checkedAmenities) url += `&amenities=${encodeURIComponent(checkedAmenities)}`;
                
                const response = await fetch(url);
                if(!response.ok) throw new Error("Failed to fetch");
                const properties = await response.json();
                
                grid.innerHTML = '';
                
                if (properties.length === 0) {
                    grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding: 3rem; color: var(--text-secondary);">No properties found for "${location}". Try another destination!</p>`;
                }

                // Clear existing map markers
                markers.forEach(m => map.removeLayer(m));
                markers = [];
                
                let bounds = [];

                properties.forEach(prop => {
                    const card = document.createElement('a');
                    card.href = `PropertyDetail.html?id=${prop.propertyId}`;
                    card.className = 'property-card';
                    
                    const ratingHtml = prop.rating > 0 ? `<div class="card-rating">★ ${prop.rating} (${prop.reviewCount})</div>` : '';
                    
                    card.innerHTML = `
                        ${ratingHtml}
                        <img src="${prop.coverImageUrl}" alt="${prop.title}">
                        <div class="card-content">
                            <h3 class="card-title">${prop.title}</h3>
                            <div class="card-location">${prop.locationCity}, ${prop.locationCountry || 'Unknown'}</div>
                            <div class="card-price">$${prop.pricePerNight} <span>/ night</span></div>
                        </div>
                    `;
                    grid.appendChild(card);
                    
                    // Add Map Marker
                    if (prop.latitude && prop.longitude) {
                        const marker = L.marker([prop.latitude, prop.longitude]).addTo(map)
                            .bindPopup(`<b>$${prop.pricePerNight}</b><br>${prop.title}`);
                        markers.push(marker);
                        bounds.push([prop.latitude, prop.longitude]);
                    }
                });
                
                // Fit map to bounds if we have markers
                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                } else {
                    map.setView([20, 0], 2); // default world view
                }

            } catch(e) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--error-color);">Error loading properties. Make sure Tomcat is running!</p>`;
                showToast("Failed to load properties", "error");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Map
            map = L.map('map').setView([20, 0], 2);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // Initial Fetch
            fetchAndRenderProperties();
            
            // Live Search Setup
            const searchInput = document.getElementById('searchInput');
            let timeout = null;
            
            const triggerSearch = () => {
                clearTimeout(timeout);
                const val = searchInput.value.trim();
                timeout = setTimeout(() => {
                    const title = document.getElementById('resultsTitle');
                    if (val) {
                        title.textContent = `Search Results for "${val}"`;
                    } else {
                        title.textContent = `Trending Destinations`;
                    }
                    fetchAndRenderProperties(val);
                }, 500); // 500ms debounce
            };

            searchInput.addEventListener('input', triggerSearch);
            
            document.getElementById('searchDealsBtn').addEventListener('click', () => {
                triggerSearch();
                document.getElementById('resultsTitle').scrollIntoView({behavior: 'smooth'});
            });
            
            // Filter Triggers
            document.getElementById('typeFilter').addEventListener('change', triggerSearch);
            document.querySelectorAll('.amenity-cb').forEach(cb => cb.addEventListener('change', triggerSearch));
            
            const priceFilter = document.getElementById('priceFilter');
            const priceVal = document.getElementById('priceVal');
            priceFilter.addEventListener('input', (e) => {
                priceVal.textContent = e.target.value;
            });
            priceFilter.addEventListener('change', triggerSearch);
        });
    </script>
</body>
</html>
