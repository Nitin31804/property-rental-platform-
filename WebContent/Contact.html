<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | Dacha Stays</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <a href="index.html">Dacha <span>Stays</span></a>
        </div>
        <div class="nav-links">
            <!-- Injected by auth.js -->
        </div>
    </nav>

    <main class="container" style="max-width: 800px; padding-top: 4rem;">
        <div class="widget">
            <h1 style="margin-bottom: 0.5rem;">Contact Support</h1>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">Have a question, feedback, or a feature request? Let us know!</p>
            
            <form id="contactForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" id="name" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" class="form-input" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <select id="subject" class="form-input" required>
                        <option value="General Inquiry">General Inquiry</option>
                        <option value="Booking Support">Booking Support</option>
                        <option value="Feature Request">Feature Request</option>
                        <option value="Bug Report">Bug Report</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="message" class="form-input" rows="5" required></textarea>
                </div>
                
                <div id="statusPanel" class="status-panel">
                    <div id="statusText"></div>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary" style="width: auto; padding: 1rem 3rem;">Send Message</button>
            </form>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusPanel');
            const statusText = document.getElementById('statusText');

            btn.disabled = true;
            status.className = 'status-panel visible loading';
            statusText.textContent = "Sending message...";

            try {
                const response = await fetch('/property-rental-app/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        subject: document.getElementById('subject').value,
                        message: document.getElementById('message').value
                    })
                });
                
                const data = await response.json();
                if (response.ok && data.success) {
                    status.className = 'status-panel visible success';
                    statusText.textContent = data.message;
                    document.getElementById('contactForm').reset();
                } else {
                    throw new Error(data.error || "Failed to submit");
                }
            } catch(err) {
                status.className = 'status-panel visible error';
                statusText.textContent = err.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
