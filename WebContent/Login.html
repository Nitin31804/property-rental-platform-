<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In | Dacha Stays</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; padding: 0;">

    <div class="widget" style="width: 100%; max-width: 450px;">
        <h1 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-input" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-input" required>
            </div>
            
            <div id="statusPanel" class="status-panel">
                <div id="statusText"></div>
            </div>

            <button type="submit" id="loginBtn" class="btn-primary">Log In</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
            Don't have an account? <a href="Register.html" style="color: var(--accent-color);">Sign up</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const status = document.getElementById('statusPanel');
            const statusText = document.getElementById('statusText');

            btn.disabled = true;
            status.className = 'status-panel visible loading';
            statusText.textContent = "Authenticating...";

            try {
                const response = await fetch('/property-rental-app/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await response.json();
                if (response.ok && data.success) {
                    status.className = 'status-panel visible success';
                    statusText.textContent = "Success! Redirecting...";
                    
                    setTimeout(() => {
                        if(data.user.role === 'Admin') window.location.href = 'AdminDashboard.html';
                        else window.location.href = 'index.html';
                    }, 1000);
                } else {
                    throw new Error(data.error || "Invalid credentials");
                }
            } catch(err) {
                status.className = 'status-panel visible error';
                statusText.textContent = err.message;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
